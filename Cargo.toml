[package]
name = "EEWParser-Rust"
version = "1.1.0"
edition = "2024"

[lib]
name = "eew_parser"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bench]]
name = "latency"
harness = false
